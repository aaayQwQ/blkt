name: Build

on:
  push:
    branches:
      - main
      - portable-single-account-plugin-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            qt_arch: win64_msvc2022_64
          - name: Linux x64
            os: ubuntu-24.04
            qt_arch: gcc_64
          - name: macOS
            os: macos-14
            qt_arch: clang_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel
