name: Build

on:
  push:
    branches:
      - main
      - portable-single-account-plugin-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            qt_arch: win64_msvc2022_64
            qt_host: windows
          - name: Linux x64
            os: ubuntu-24.04
            qt_arch: ''
            qt_host: ''
          - name: macOS
            os: macos-15-intel
            qt_arch: clang_64
            qt_host: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-websockets-dev qt6-declarative-dev

      - name: Install Qt on Windows and macOS
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtwebsockets qtdeclarative
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install portable package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install build --prefix "$env:GITHUB_WORKSPACE/package" --config Release

      - name: Install portable package (Unix)
        if: runner.os != 'Windows'
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/package" --config Release

      - name: Archive portable package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath BLKT-windows-x64.zip

      - name: Archive portable package (macOS)
        if: runner.os == 'macOS'
        run: tar -czf "BLKT-macOS-${{ runner.arch }}.tar.gz" -C package .

      - name: Archive Linux package (Qt 6 runtime required)
        if: runner.os == 'Linux'
        run: tar -czf "BLKT-Linux-${{ runner.arch }}-Qt6-runtime-required.tar.gz" -C package .

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BLKT-${{ runner.os }}-${{ runner.arch }}
          path: BLKT-*.*
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        run: brew install qtbase qtwebsockets qtdeclarative qttools

      - name: Configure
        run: |
          QT_BASE="$(brew --prefix qtbase)"
          QT_WEBSOCKETS="$(brew --prefix qtwebsockets)"
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$QT_BASE" -DQt6WebSockets_DIR="$QT_WEBSOCKETS/lib/cmake/Qt6WebSockets" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install portable package
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/package" --config Release

      - name: Archive portable package
        run: tar -czf BLKT-macos-ARM64.tar.gz -C package .

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BLKT-macos-ARM64
          path: BLKT-macos-ARM64.tar.gz
          if-no-files-found: error
